<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <style>
    .auth-wrap{max-width:520px;margin:40px auto;}
    .auth-card{background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(99,102,241,.12);overflow:hidden;}
    .auth-header{background:linear-gradient(135deg,#6366f1,#8b5cf6);padding:30px;text-align:center;color:#fff;}
    .auth-header .icon{width:60px;height:60px;border-radius:16px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 12px;}
    .auth-header h2{font-size:1.4rem;font-weight:700;margin:0;}
    .auth-header p{opacity:.85;font-size:.85rem;margin:6px 0 0;}
    .auth-body{padding:30px;}
    .auth-input{width:100%;padding:14px 16px;border:2px solid #e5e7eb;border-radius:12px;font-size:1rem;font-family:'Courier New',monospace;letter-spacing:1px;transition:all .3s;outline:none;box-sizing:border-box;}
    .auth-input:focus{border-color:#6366f1;box-shadow:0 0 0 4px rgba(99,102,241,.12);}
    .auth-btn{width:100%;padding:13px;border:none;border-radius:12px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;transition:all .3s;box-shadow:0 4px 14px rgba(99,102,241,.35);}

    .auth-back{display:inline-block;margin-top:16px;color:#6b7280;text-decoration:none;font-size:.9rem;}
    .auth-back:hover{color:#6366f1;}
    .domain-tag{display:inline-block;background:#eef2ff;color:#6366f1;padding:3px 10px;border-radius:6px;font-weight:600;font-size:.85rem;}
    </style>
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-header">
            <div class="icon"><i class="layui-icon layui-icon-auz"></i></div>
            <h2>授权验证</h2>
            <p>请输入您的授权码以继续安装</p>
        </div>
        <div class="auth-body">
            <form id="authForm">
                <div style="margin-bottom:8px;color:#374151;font-weight:600;font-size:.9rem;">授权码</div>
                <input type="text" name="auth_code" id="auth_code" required placeholder="请输入授权码（如 CH-XXXX-XXXX-XXXX-XXXX）" class="auth-input">
                <button type="button" class="auth-btn" id="verifyBtn" style="margin-top:18px;">验证授权码</button>
            </form>
            <div class="auth-result" id="resultBox"></div>
            <div class="auth-tips">
                <div><i class="layui-icon layui-icon-about" style="color:#6366f1;"></i> <strong>温馨提示</strong></div>
                <div>1. 请输入您购买的授权码</div>
                <div>2. 授权码将绑定当前域名：<span class="domain-tag"><?php echo preg_replace('/^www\./','',strtolower($_SERVER['HTTP_HOST'])); ?></span></div>
                <div>3. 一个授权码只能绑定一个域名，绑定后不可更换</div>
                <div>4. 如无授权码，请前往 <a href="https://auth.wetcs.cn/user/buy.php" target="_blank" style="color:#6366f1;font-weight:600;text-decoration:underline;">授权站购买</a> 或联系系统管理员获取</div>
            </div>
            <a class="auth-back" href="./index.php?s=step2"><i class="layui-icon layui-icon-left"></i> 返回上一步</a>
        </div>
    </div>
</div>
<script>
layui.use(['layer'], function(){
    var $ = layui.jquery, layer = layui.layer;
    $('#verifyBtn').on('click', function(){
        var code = $('#auth_code').val().trim();
        if(!code){ layer.msg('请输入授权码', {icon:2}); return; }
        var btn = $(this);
        btn.prop('disabled', true).text('验证中...');
        $.ajax({
            url: './index.php?s=auth',
            type: 'POST',
            data: {auth_code: code},
            dataType: 'json',
            success: function(res){
                btn.prop('disabled', false).text('验证授权码');
                var box = $('#resultBox');
                box.show();
                if(res.code === 0){
                    box.removeClass('error').addClass('success').html('<i class="layui-icon layui-icon-ok"></i> ' + res.msg + '，正在进入安装步骤...');
                    setTimeout(function(){ window.location.href = './index.php?s=step3'; }, 1500);
                } else {
                    // 详细调试输出
                    var html = '<i class="layui-icon layui-icon-close"></i> <strong>' + res.msg + '</strong>';
                    if(res.debug){
                        html += '<div style="margin-top:12px;padding:10px;background:rgba(0,0,0,.05);border-radius:6px;font-size:12px;line-height:1.7;font-family:monospace;color:#555;word-break:break-all;">';
                        html += '<div><b>请求URL：</b>' + res.debug.url + '</div>';
                        html += '<div><b>HTTP状态码：</b>' + res.debug.http_code + '</div>';
                        if(res.debug.curl_error) html += '<div style="color:#d32f2f;"><b>CURL错误：</b>' + res.debug.curl_error + '</div>';
                        if(res.debug.raw_resp) html += '<div><b>授权站返回：</b>' + res.debug.raw_resp + '</div>';
                        html += '</div>';
                    }
                    box.removeClass('success').addClass('error').html(html);
                }
            },
            error: function(xhr){
                btn.prop('disabled', false).text('验证授权码');
                var box = $('#resultBox');
                box.show().removeClass('success').addClass('error');
                var html = '<i class="layui-icon layui-icon-close"></i> <strong>请求失败（无法解析JSON）</strong>';
                html += '<div style="margin-top:12px;padding:10px;background:rgba(0,0,0,.05);border-radius:6px;font-size:12px;line-height:1.7;font-family:monospace;color:#555;word-break:break-all;">';
                html += '<div><b>状态码：</b>' + xhr.status + ' ' + xhr.statusText + '</div>';
                html += '<div><b>返回内容前500字：</b>' + (xhr.responseText ? xhr.responseText.substring(0, 500) : '(空)') + '</div>';
                html += '</div>';
                box.html(html);
            }
        });
    });
    $('#auth_code').on('keypress', function(e){
        if(e.which === 13){ e.preventDefault(); $('#verifyBtn').click(); }
    });
});
</script>
</body>
</html>
